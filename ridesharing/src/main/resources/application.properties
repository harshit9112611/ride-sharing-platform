# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/ridesharingdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT
jwt.secret=CollegeRideSharingSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024
jwt.expiration=86400000

# Email — Brevo (formerly Sendinblue)
# Brevo Email
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=2507harshit@gmail.com
brevo.sender.name=LNCTShares

frontend.url=http://localhost:5173

